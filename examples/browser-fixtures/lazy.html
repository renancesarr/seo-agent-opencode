<!doctype html><html lang="pt-BR"><head><title>Fixture lazy</title></head><body><div style="height:3000px"></div><div id="target"></div><script>const observer = new IntersectionObserver(entries => { if (entries.some(e => e.isIntersecting)) { document.querySelector("#target").textContent = "LAZY_READY"; observer.disconnect(); } }); observer.observe(document.querySelector("#target"));</script></body></html>
