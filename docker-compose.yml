services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Defina SEARXNG_SECRET no .env local}"
      GRANIAN_HOST: "0.0.0.0"
      GRANIAN_PORT: "8080"
      FORCE_OWNERSHIP: "false"
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

volumes:
  searxng-data:
